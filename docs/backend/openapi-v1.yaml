components:
  schemas:
    ApiKeyCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
        expires_in_days:
          type: integer
          maximum: 3650
          minimum: 1
          nullable: true
      required:
      - name
    BlankEnum:
      enum:
      - ''
    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        type:
          type: string
          maxLength: 32
        status:
          $ref: '#/components/schemas/StatusEnum'
        is_primary:
          type: boolean
        address:
          type: string
          maxLength: 255
      required:
      - id
      - name
    BranchListResponse:
      type: object
      properties:
        count:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
      required:
      - count
      - results
    BranchRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          type: string
          minLength: 1
          maxLength: 32
        status:
          $ref: '#/components/schemas/StatusEnum'
        is_primary:
          type: boolean
        address:
          type: string
          maxLength: 255
      required:
      - name
    ChangePasswordRequestRequest:
      type: object
      properties:
        current_password:
          type: string
          minLength: 1
        new_password:
          type: string
          minLength: 1
      required:
      - current_password
      - new_password
    FleetSizeBandEnum:
      enum:
      - 10-50
      - 50-200
      - 200-1000
      - 1000+
      type: string
      description: |-
        * `10-50` - 10 – 50 Vehicles
        * `50-200` - 50 – 200 Vehicles
        * `200-1000` - 200 – 1,000 Vehicles
        * `1000+` - 1,000+ Vehicles
    ForgotPasswordRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    InvitationCreateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        role:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - email
      - role
    LoginRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 200
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        legal_name:
          type: string
          maxLength: 200
        tax_id:
          type: string
          maxLength: 64
        headquarters_address:
          type: string
          maxLength: 300
        base_currency:
          type: string
          maxLength: 3
        verification_status:
          allOf:
          - $ref: '#/components/schemas/VerificationStatusEnum'
          readOnly: true
        fleet_size_band:
          oneOf:
          - $ref: '#/components/schemas/FleetSizeBandEnum'
          - $ref: '#/components/schemas/BlankEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - slug
      - verification_status
    PatchedBranchRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          type: string
          minLength: 1
          maxLength: 32
        status:
          $ref: '#/components/schemas/StatusEnum'
        is_primary:
          type: boolean
        address:
          type: string
          maxLength: 255
    PatchedMemberRoleRequest:
      type: object
      properties:
        role:
          type: string
          minLength: 1
          maxLength: 64
    PatchedOrganizationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        legal_name:
          type: string
          maxLength: 200
        tax_id:
          type: string
          maxLength: 64
        headquarters_address:
          type: string
          maxLength: 300
        base_currency:
          type: string
          minLength: 1
          maxLength: 3
        fleet_size_band:
          oneOf:
          - $ref: '#/components/schemas/FleetSizeBandEnum'
          - $ref: '#/components/schemas/BlankEnum'
    PatchedPlatformOrgStatusUpdateRequestRequest:
      type: object
      properties:
        is_active:
          type: boolean
        verification_status:
          $ref: '#/components/schemas/VerificationStatusEnum'
    PatchedRoleUpdateRequest:
      type: object
      properties:
        label:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 255
        permissions:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
    PatchedSettingsRequest:
      type: object
      properties:
        distance_unit:
          type: string
          minLength: 1
          maxLength: 4
        date_format:
          type: string
          minLength: 1
          maxLength: 32
        feature_flags: {}
        notification_preferences: {}
    RegisterRequestRequest:
      type: object
      properties:
        companyName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
        full_name:
          type: string
        phone:
          type: string
        acceptTerms:
          type: boolean
          default: true
      required:
      - companyName
      - email
      - password
    ResendVerificationRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    ResetPasswordRequestRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - password
      - token
    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 64
        label:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 255
        is_builtin:
          type: boolean
          readOnly: true
        permissions:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - id
      - is_builtin
      - name
      - permissions
    RoleCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        label:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 255
        permissions:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
      required:
      - name
    RoleListResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Role'
      required:
      - results
    Settings:
      type: object
      properties:
        distance_unit:
          type: string
          maxLength: 4
        date_format:
          type: string
          maxLength: 32
        feature_flags: {}
        notification_preferences: {}
    StatusEnum:
      enum:
      - active
      - inactive
      type: string
      description: |-
        * `active` - Active
        * `inactive` - Inactive
    SwitchOrganizationRequestRequest:
      type: object
      properties:
        organization_id:
          type: string
          format: uuid
      required:
      - organization_id
    VerificationStatusEnum:
      enum:
      - pending
      - verified
      - rejected
      type: string
      description: |-
        * `pending` - Pending
        * `verified` - Verified
        * `rejected` - Rejected
    VerifyEmailRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        code:
          type: string
          minLength: 1
      required:
      - code
      - email
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      description: 15-minute JWT access token (kept in memory by the SPA).
