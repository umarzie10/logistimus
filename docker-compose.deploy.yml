# Logistimus staging/production stack — full parity: nginx (TLS) + frontend +
# Django api + Celery worker/beat + PostgreSQL + Redis + MinIO/S3.
#
# Usage (from the repository root):
#   export NEXT_PUBLIC_API_URL=https://api.<your-domain>/api/v1
#   export POSTGRES_PASSWORD='<strong password>'
#   docker compose -f docker-compose.deploy.yml up -d --build
#
# Rules:
#   * ONLY nginx publishes host ports (80/443). db/redis/minio/api/frontend
#     are reachable exclusively on the internal `logistimus` network.
#   * Settings module is pinned to config.settings.prod — the container
#     refuses to boot with the dev sentinel SECRET_KEY.
#   * DATABASE_URL / REDIS_URL / CELERY_* are forced to in-network service
#     hostnames below; every other secret comes from Backend/.env.
#   * TLS certificates live in infrastructure/tls/{fullchain,privkey}.pem
#     (gitignored) — see DEPLOYMENT_GUIDE.md for provisioning.

name: logistimus

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logistimus}
      POSTGRES_USER: ${POSTGRES_USER:-logistimus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logistimus} -d ${POSTGRES_DB:-logistimus}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [logistimus]
    # intentionally no `ports:` — never expose Postgres on the host

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [logistimus]
    # intentionally no `ports:` — never expose Redis on the host

  minio:
    # Docker Hub removed minio/minio (2026); Quay hosts the current image.
    image: quay.io/minio/aistor/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-logistimus}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    volumes:
      - miniodata:/data
    healthcheck:
      # curl-based liveness: `mc ready local` fails while the AIStor license is
      # absent (offline mode), but the process-level health endpoint still
      # answers 200. S3 *operations* are a separate, documented blocker.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [logistimus]
    # intentionally no `ports:` — object storage stays internal

  api:
    build: ./Backend
    restart: unless-stopped
    command: uv run uvicorn config.asgi:application --host 0.0.0.0 --port 8000
    env_file:
      - ./Backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      # In-network endpoints (override whatever localhost values sit in .env)
      DATABASE_URL: postgres://${POSTGRES_USER:-logistimus}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-logistimus}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
    volumes:
      - api_media:/app/media
    healthcheck:
      test: ["CMD", "uv", "run", "python", "healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [logistimus]

  worker:
    build: ./Backend
    restart: unless-stopped
    command: uv run celery -A config worker -l info --concurrency 2
    env_file:
      - ./Backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER:-logistimus}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-logistimus}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [logistimus]

  beat:
    build: ./Backend
    restart: unless-stopped
    command: uv run celery -A config beat -l info
    env_file:
      - ./Backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER:-logistimus}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-logistimus}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [logistimus]

  frontend:
    build:
      context: ./Frontend
      args:
        # Inlined into the bundle at build time — must be the PUBLIC api origin.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set to the public api origin + /api/v1}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [logistimus]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # :z (shared SELinux label) — both dev and deploy stacks may mount these;
      # :Z would make the label private to one container and break the other.
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/logistimus.conf:ro,z
      # Neutralize the stock default site: its `server_name localhost`
      # outranks our catch-all and answers 404 instead of the HTTP→HTTPS
      # redirect for direct-IP/localhost probes.
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z
      - ./infrastructure/tls:/etc/nginx/tls:ro,z
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [logistimus]

networks:
  logistimus:

volumes:
  pgdata:
  redisdata:
  miniodata:
  api_media:
