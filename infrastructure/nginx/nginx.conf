# Logistimus Nginx — TLS termination + reverse proxy to Django (Daphne/Uvicorn).
upstream logistimus_api {
    server api:8000;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.logistimus.example.com;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS (mirrors Django SECURE_HSTS_SECONDS in prod)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Uploads: frontend sends file uploads; keep in sync with DATA_UPLOAD_MAX_MEMORY_SIZE
    client_max_body_size 25m;

    # Never leak server version
    server_tokens off;

    # Static + media (whitenoise serves static from Django; media may be local in dev)
    location /static/ {
        alias /var/www/logistimus/staticfiles/;
        access_log off;
        expires 30d;
    }

    # API endpoints → Django
    location /api/ {
        proxy_pass http://logistimus_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # WebSocket (Channels) — /ws/ requires long-lived connections
    location /ws/ {
        proxy_pass http://logistimus_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # Health endpoints (no auth, used by uptime checks)
    location /api/v1/health/ {
        proxy_pass http://logistimus_api;
        access_log off;
    }

    location / {
        return 404;
    }
}
