# Logistimus Nginx — TLS termination + reverse proxy to Django (Daphne/Uvicorn)
# and the Next.js production server. Meant for /etc/nginx/conf.d/ (http context).
#
# Logging: the image's stock main conf writes /var/log/nginx/{access,error}.log
# INSIDE the container, which `docker logs nginx` never shows. Override both to
# stdout/stderr here so `docker logs` works and the json-file rotation in
# docker-compose.deploy.yml applies (log files on disk would never rotate).
access_log /dev/stdout main;
error_log  /dev/stderr notice;

upstream logistimus_api {
    server api:8000;
}

upstream logistimus_app {
    server frontend:3000;
}

# Redirect HTTP → HTTPS.
# NOTE: the /nginx-health location must be INSIDE this server, not a
# server-level `return` — a server-context return runs before location
# matching and would swallow the healthcheck probe.
server {
    listen 80;
    server_name _;

    # Liveness target for the compose healthcheck: plain HTTP, no TLS, no
    # upstream dependency, never logged.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.logistimus.example.com;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS (mirrors Django SECURE_HSTS_SECONDS in prod)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Uploads: frontend sends file uploads; keep in sync with DATA_UPLOAD_MAX_MEMORY_SIZE
    client_max_body_size 25m;

    # Never leak server version
    server_tokens off;

    # Static + media (whitenoise serves static from Django; media may be local in dev)
    location /static/ {
        alias /var/www/logistimus/staticfiles/;
        access_log off;
        expires 30d;
    }

    # API endpoints → Django
    location /api/ {
        proxy_pass http://logistimus_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # WebSocket (Channels) — /ws/ requires long-lived connections
    location /ws/ {
        proxy_pass http://logistimus_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # Health endpoints (no auth, used by uptime checks).
    # Host MUST be forwarded: without it nginx sends its default
    # $proxy_host (the upstream name) and Django rejects the request with
    # DisallowedHost → 400 instead of 200/503.
    location /api/v1/health/ {
        proxy_pass http://logistimus_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location / {
        return 404;
    }
}

# ---------------------------------------------------------------------------
# Frontend (Next.js standalone server) — public app origin
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name app.logistimus.example.com;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    server_tokens off;

    # Uploads initiated from the app go straight to the API origin,
    # but keep the body limit consistent with the API vhost.
    client_max_body_size 25m;

    location / {
        proxy_pass http://logistimus_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Next.js standalone serves its own static assets; no caching override
    # needed here — Next fingerprints /_next/static/* immutable URLs.
}
