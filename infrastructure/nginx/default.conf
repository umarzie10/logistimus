# Replaces the stock nginx default site (which serves /usr/share/nginx/html
# and answers 404 for every path on port 80). Kept as a valid (empty) conf.d
# file so the image's default site can never shadow the HTTP→HTTPS redirect
# defined in logistimus.conf.
#
# Mounted over /etc/nginx/conf.d/default.conf by docker-compose.deploy.yml.
