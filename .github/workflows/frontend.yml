name: Frontend CI

on:
  push:
    branches: [main]
    paths: ["Frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["Frontend/**", ".github/workflows/frontend.yml"]

# Least privilege: CI only reads the checkout.
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npx eslint --quiet

      - name: Type check (tsc)
        run: npx tsc --noEmit

      # Build runs with a placeholder public API origin: this job proves the
      # bundle compiles, it does not validate a real environment.
      - name: Build (next)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://ci.invalid/api/v1

      - name: Audit dependencies (high+critical only)
        run: npm audit --audit-level=high
